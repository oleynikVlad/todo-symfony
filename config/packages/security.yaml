# Security Configuration
#
# LARAVEL vs SYMFONY — Security:
# - Laravel: config/auth.php defines guards, providers, passwords
#   Guards: session, token, sanctum, passport
#   Middleware: auth, auth:sanctum, auth:api
#
# - Symfony: config/packages/security.yaml defines firewalls, providers, access_control
#   Firewalls: Define HOW users authenticate (JWT, form_login, etc.)
#   Providers: Define WHERE users come from (database, in-memory, LDAP)
#   Access Control: Define WHO can access WHAT (by path pattern + roles)

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/(login|register|doc)
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/(login|register), roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
